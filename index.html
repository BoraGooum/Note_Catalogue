<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Mon Univers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <span class="ic" data-ic="orbit"></span>
  <h1>Mon Univers</h1>
</header>
<main>
  <section id="view-search" class="view active">
    <div class="sbar">
      <input type="search" id="search-input" placeholder="Titre, auteur, année…" enterkeyhint="search" autocomplete="off">
      <button class="sq-btn" id="search-barcode" aria-label="Scanner EAN"><span class="ic" data-ic="barcode"></span></button>
      <button class="sq-btn" id="search-loupe" aria-label="Chercher"><span class="ic" data-ic="search"></span></button>
      <button class="sq-btn" id="search-recent-btn" aria-label="Recherches récentes"><span class="ic" data-ic="clock"></span></button>
    </div>
    <div class="type-dropdown">
      <div class="type-dropdown-btn" id="type-btn">
        <span class="ic" id="type-btn-ic" data-ic="film"></span>
        <span id="type-label">Film</span>
        <span class="ic chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="type-dropdown-list" id="type-list"></div>
    </div>
    <div class="status" id="search-status"></div>
    <div class="result-list" id="results"></div>
  </section>
  <section id="view-collection" class="view">
    <div class="sbar">
      <input type="search" id="col-search" placeholder="Chercher dans ma bibliothèque…" autocomplete="off">
      <button class="sq-btn" id="col-loupe" aria-label="Chercher"><span class="ic" data-ic="search"></span></button>
    </div>
    <div class="tools">
      <button id="col-filter-btn"><span class="ic" data-ic="sliders-horizontal"></span><span>Filtres &amp; Tri</span></button>
    </div>
    <div class="grid" id="col-grid"></div>
  </section>
  <section id="view-journal" class="view">
    <div class="jhead">
      <div class="jtitle" id="bilan-title">Journal</div>
      <button class="rnd-btn" id="journal-cal-btn" aria-label="Calendrier"><span class="ic" data-ic="calendar"></span></button>
    </div>
    <div class="hrow" id="j-encours"></div>
    <div class="sec-head sticky"><span class="ic" data-ic="book-open"></span><span>Notes du mois</span></div>
    <div id="j-feed"></div>
  </section>
  <section id="view-options" class="view">
    <div class="opt-grid" id="opt-grid"></div>
  </section>
</main>
<nav class="tabbar">
  <button class="active" data-view="search"><span class="ic" data-ic="search"></span><span>Recherche</span></button>
  <button data-view="collection"><span class="ic" data-ic="library"></span><span>Bibliothèque</span></button>
  <button data-view="journal" id="tab-journal"><span class="badge-dot" id="journal-badge" style="display:none;"></span><span class="ic" data-ic="book-open"></span><span>Journal</span></button>
  <button data-view="options"><span class="ic" data-ic="settings"></span><span>Options</span></button>
</nav>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal-overlay"><div class="sheet">
  <div class="m-head">
    <button class="rnd-btn" id="m-back" aria-label="Retour"><span class="ic" data-ic="arrow-left"></span></button>
    <div class="m-title" id="m-title"></div>
    <div class="m-spacer"></div>
  </div>
  <div class="m-body" id="m-body"></div>
  <div class="m-foot" id="m-foot"></div>
</div></div>
<div class="overlay" id="reader-overlay"><div class="sheet reader">
  <div class="m-head">
    <button class="rnd-btn" id="r-back" aria-label="Retour"><span class="ic" data-ic="arrow-left"></span></button>
    <div class="m-title" id="r-title"></div>
    <div class="m-spacer"></div>
  </div>
  <div class="r-sub mono" id="r-sub"></div>
  <div class="m-body" id="r-body"></div>
  <div class="m-foot">
    <button id="r-delete"><span class="ic" data-ic="trash-2"></span><span>Supprimer</span></button>
    <button id="r-edit"><span class="ic" data-ic="pen"></span><span>Modifier</span></button>
  </div>
</div></div>
<div class="overlay" id="qn-overlay"><div class="sheet low">
  <div class="m-head">
    <button class="rnd-btn" id="qn-back" aria-label="Retour"><span class="ic" data-ic="arrow-left"></span></button>
    <div class="m-title" id="qn-title"></div>
    <div class="m-spacer"></div>
  </div>
  <div class="m-body">
    <div class="field hidden" id="qn-entry-row">
      <span class="flabel">Œuvre</span>
      <button class="wide" id="qn-entry-btn"><span class="ic" data-ic="box"></span><span id="qn-entry-label">Choisir une œuvre…</span></button>
    </div>
    <div class="chips" id="qn-kind"></div>
    <div class="field hidden" id="qn-when-row">
      <span class="flabel">Date</span>
      <button class="wide" id="qn-when-btn"><span class="ic" data-ic="calendar"></span><span id="qn-when-label">Maintenant</span></button>
    </div>
    <div class="field hidden" id="qn-ep-row">
      <span class="flabel">Saison / Épisode</span>
      <div class="row2">
        <label>Saison<input type="number" id="qn-s" inputmode="numeric" min="0" placeholder="1"></label>
        <label>Épisode<input type="number" id="qn-e" inputmode="numeric" min="0" placeholder="1"></label>
        <button class="sq-btn" id="qn-ep-plus" aria-label="Voir les épisodes"><span class="ic" data-ic="plus"></span></button>
      </div>
    </div>
    <div class="field hidden" id="qn-pages-row">
      <span class="flabel">Pages</span>
      <div class="row2">
        <label>Lues<input type="number" id="qn-read" inputmode="numeric" min="0" placeholder="120"></label>
        <label>Total<input type="number" id="qn-total" inputmode="numeric" min="0" placeholder="320"></label>
      </div>
    </div>
    <div class="field hidden" id="qn-session-row">
      <span class="flabel">Durée de session</span>
      <input type="text" id="qn-dur" placeholder="ex : 2h30">
    </div>
    <div class="field">
      <span class="flabel">Ton avis</span>
      <textarea id="qn-text" placeholder="Écris librement…"></textarea>
    </div>
  </div>
  <div class="m-foot">
    <button class="primary" id="qn-save"><span class="ic" data-ic="plus"></span><span>Ajouter</span></button>
    <button id="qn-cancel"><span class="ic" data-ic="x"></span><span>Annuler</span></button>
  </div>
</div></div>
<div class="overlay" id="menu-overlay"><div class="sheet low">
  <div class="m-head">
    <button class="rnd-btn" id="menu-back" aria-label="Retour"><span class="ic" data-ic="arrow-left"></span></button>
    <div class="m-title" id="menu-title"></div>
    <div class="m-spacer"></div>
  </div>
  <div class="m-body" id="menu-body"></div>
</div></div>
<div class="overlay" id="confirm-overlay"><div class="sheet low">
  <div class="m-head">
    <button class="rnd-btn" id="confirm-back" aria-label="Retour"><span class="ic" data-ic="arrow-left"></span></button>
    <div class="m-title" id="confirm-title"></div>
    <div class="m-spacer"></div>
  </div>
  <div class="m-body" id="confirm-body"></div>
  <div class="m-foot" id="confirm-foot"></div>
</div></div>
<div class="overlay dark" id="poster-overlay">
  <img id="poster-img" alt="">
  <div class="bar"><button id="poster-close"><span class="ic" data-ic="arrow-left"></span><span>Fermer</span></button></div>
</div>
<div class="overlay" id="filter-panel-overlay"><div class="filter-panel">
  <div class="head">
    <button class="rnd-btn" id="filter-back" aria-label="Retour"><span class="ic" data-ic="arrow-left"></span></button>
    <h3>Filtres &amp; Tri</h3>
    <button class="apply-btn" id="filter-apply"><span>Appliquer</span></button>
  </div>
  <div class="fsec"><h4>Type</h4><div class="chips" id="filter-type-chips"></div></div>
  <div class="fsec"><h4>Support</h4><div class="chips" id="filter-support-chips"></div></div>
  <div class="fsec"><h4>Trier par</h4><div class="sort-row" id="filter-sort-btns"></div></div>
  <div class="factions"><button id="filter-reset"><span class="ic" data-ic="rotate-ccw"></span><span>Réinitialiser</span></button></div>
</div></div>
<div class="overlay" id="calendar-overlay"><div class="cal-modal">
  <div class="head">
    <button class="rnd-btn" id="cal-back" aria-label="Fermer"><span class="ic" data-ic="arrow-left"></span></button>
    <div class="cal-picker">
      <button class="cal-pick-btn" id="cal-month-btn"><span>Mois</span></button>
      <button class="cal-pick-btn" id="cal-year-btn"><span>Année</span></button>
    </div>
  </div>
  <div class="cal-dow" id="cal-dow"></div>
  <div class="cal-grid" id="cal-grid"></div>
</div></div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
