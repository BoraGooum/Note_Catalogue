<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Ma Collection</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
window.__dbgLines=[];
window.__dbg=function(m){window.__dbgLines.push(m);var d=document.getElementById("dbg");if(!d){d=document.createElement("div");d.id="dbg";d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a1020;color:#fff;font:11px monospace;padding:8px;white-space:pre-wrap;max-height:45vh;overflow:auto;";document.body.appendChild(d);}d.textContent=window.__dbgLines.join("\n");};
window.addEventListener("error",function(e){__dbg("ERR: "+e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno);});
window.addEventListener("unhandledrejection",function(e){__dbg("REJECT: "+((e.reason&&e.reason.message)||e.reason));});
setTimeout(function(){var c=document.getElementById("type-list");if(!c){__dbg("DIAG: HTML non mis à jour !");}},4000);
</script>
<header>
  <span class="ic" data-ic="library"></span>
  <h1>Ma Collection</h1>
</header>
<main>

  <!-- VUE RECHERCHE -->
  <section id="view-search" class="view active">
    <div class="sbar">
      <div class="sbar-wrap">
        <span class="search-ic"><span class="ic" data-ic="search"></span></span>
        <input type="search" id="search-input" placeholder="Chercher un titre&hellip;" enterkeyhint="search" autocomplete="off">
      </div>
      <button class="menu-btn" id="search-menu-btn"><span class="ic" data-ic="more-horizontal"></span></button>
    </div>
    <div class="type-dropdown">
      <div class="type-dropdown-btn" id="type-btn">
        <span class="ic" id="type-btn-ic" data-ic="film"></span>
        <span id="type-label">Film</span>
        <span class="ic chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="type-dropdown-list" id="type-list"></div>
    </div>
    <div id="adv-panel" class="card hidden">
      <div class="row2"><label>Ann&eacute;e min<input type="number" id="adv-year-min" inputmode="numeric" placeholder="1900"></label><label>Ann&eacute;e max<input type="number" id="adv-year-max" inputmode="numeric" placeholder="2026"></label></div>
      <div class="row2"><label>Note min<input type="number" id="adv-note-min" inputmode="numeric" min="0" max="10" placeholder="0"></label><label id="adv-plat-wrap">Plateforme<input type="text" id="adv-platform" placeholder="PS5, Switch&hellip;"></label></div>
    </div>
    <div class="status" id="search-status"></div>
    <div id="fallback"></div>
    <div class="result-list" id="results"></div>
  </section>

  <!-- VUE COLLECTION -->
  <section id="view-collection" class="view">
    <input type="search" id="col-search" placeholder="Chercher dans ma biblioth&egrave;que&hellip;" autocomplete="off">
    <div class="chips small" id="col-support-filter"></div>
    <div class="tools">
      <div class="seg small" id="col-sort"></div>
      <button class="btn icon" id="col-view" title="Grille / Liste"><span class="ic" data-ic="grid"></span></button>
    </div>
    <div id="col-grid" class="grid"></div>
  </section>

  <!-- VUE JOURNAL -->
  <section id="view-journal" class="view">
    <div class="hrow" id="j-encours"></div>
    <div class="card bilan" id="j-bilan">
      <button class="btn icon" id="bilan-prev"><span class="ic" data-ic="chevL"></span></button>
      <strong id="bilan-title"></strong>
      <button class="btn icon" id="bilan-next"><span class="ic" data-ic="chevR"></span></button>
    </div>
    <button class="btn wide" id="j-cal-btn"><span class="ic" data-ic="calendar"></span>Calendrier</button>
    <div id="j-cal" class="card hidden"></div>
    <div class="flux-header">
      <h3>Flux</h3>
      <div class="flux-actions">
        <button class="btn icon" id="flux-copy" title="Copier le mois"><span class="ic" data-ic="clipboard-copy"></span></button>
        <button class="btn icon" id="flux-add" title="Ajouter une entr&eacute;e"><span class="ic" data-ic="pen"></span></button>
        <button class="btn icon" id="flux-filter" title="Filtrer / Trier"><span class="ic" data-ic="sliders-horizontal"></span></button>
      </div>
    </div>
    <div id="j-feed"></div>
  </section>

  <!-- VUE OPTIONS -->
  <section id="view-options" class="view">
    <div class="opt-grid" id="opt-grid"></div>
  </section>

</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL PRINCIPAL -->
<div class="overlay" id="modal-overlay"><div class="sheet">
  <div class="m-head"><div class="m-title" id="m-title"></div><button class="btn icon" id="m-close"><span class="ic" data-ic="x"></span></button></div>
  <div class="m-body" id="m-body"></div>
  <div class="m-foot" id="m-foot"></div>
</div></div>

<!-- LECTEUR -->
<div class="overlay" id="reader-overlay"><div class="sheet reader">
  <div class="m-head"><div class="m-title" id="r-title"></div><button class="btn icon" id="r-close"><span class="ic" data-ic="x"></span></button></div>
  <div class="r-sub mono" id="r-sub"></div>
  <div class="m-body" id="r-body"></div>
  <div class="m-foot">
    <button class="btn" id="r-delete"><span class="ic" data-ic="trash-2"></span>Supprimer</button>
    <button class="btn" id="r-edit"><span class="ic" data-ic="pen"></span>Modifier</button>
  </div>
</div></div>

<!-- NOTE RAPIDE -->
<div class="overlay" id="qn-overlay"><div class="sheet low">
  <div class="m-head"><div class="m-title" id="qn-title"></div><button class="btn icon" id="qn-close"><span class="ic" data-ic="x"></span></button></div>
  <div class="m-body">
    <div class="chips small" id="qn-kind"></div>
    <div class="row2 hidden" id="qn-when-row"><label>Date &amp; heure (optionnel)<input type="datetime-local" id="qn-when"></label></div>
    <div class="row2 hidden" id="qn-ep-row"><label>S<input type="number" id="qn-s" inputmode="numeric" min="0"></label><label>E<input type="number" id="qn-e" inputmode="numeric" min="0"></label><label>/10<input type="number" id="qn-note" inputmode="numeric" min="1" max="10"></label></div>
    <textarea id="qn-text" placeholder="Ton entr&eacute;e&hellip;"></textarea>
  </div>
  <div class="m-foot"><button class="btn primary" id="qn-save"><span class="ic" data-ic="plus"></span>Ajouter</button><button class="btn" id="qn-cancel"><span class="ic" data-ic="x"></span>Annuler</button></div>
</div></div>

<!-- MENU ŒUVRE -->
<div class="overlay" id="menu-overlay"><div class="sheet low">
  <div class="m-head"><div class="m-title" id="menu-title"></div><button class="btn icon" id="menu-close"><span class="ic" data-ic="x"></span></button></div>
  <div class="m-body" id="menu-body"></div>
</div></div>

<!-- MENU RECHERCHE (⋮) -->
<div class="overlay" id="search-menu-overlay"><div class="sheet low">
  <div class="m-head"><div class="m-title">Menu</div><button class="btn icon" id="search-menu-close"><span class="ic" data-ic="x"></span></button></div>
  <div class="m-body" id="search-menu-body"></div>
</div></div>

<!-- CONFIRMATION -->
<div class="overlay" id="confirm-overlay"><div class="sheet low">
  <div class="m-head"><div class="m-title" id="confirm-title"></div><button class="btn icon" id="confirm-close"><span class="ic" data-ic="x"></span></button></div>
  <div class="m-body" id="confirm-body"></div>
  <div class="m-foot" id="confirm-foot"></div>
</div></div>

<!-- AFFICHE PLEIN ÉCRAN -->
<div class="overlay dark" id="poster-overlay">
  <img id="poster-img" alt="">
  <div class="bar"><button class="btn" id="poster-close"><span class="ic" data-ic="x"></span>Fermer</button></div>
</div>

<!-- TABBAR -->
<nav class="tabbar">
  <button class="active" data-view="search"><span class="ic" data-ic="search"></span><span>Recherche</span></button>
  <button data-view="collection"><span class="ic" data-ic="library"></span><span>Collection</span></button>
  <button data-view="journal"><span class="ic" data-ic="book"></span><span>Journal</span></button>
  <button data-view="options"><span class="ic" data-ic="settings"></span><span>Option</span></button>
</nav>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
