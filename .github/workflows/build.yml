name: Build site

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create config file
        run: |
          echo "export const TMDB_KEY='${{ secrets.TMDB_KEY }}';" >> config.js
          echo "export const RAWG_KEY='${{ secrets.RAWG_KEY }}';" >> config.js
          echo "export const GOOGLE_BOOKS_KEY='${{ secrets.GOOGLE_BOOKS_KEY }}';" >> config.js
          echo "export const STEAMGRID_KEY='${{ secrets.STEAMGRID_KEY }}';" >> config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v2
