name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.js
        run: |
          echo "export const TMDB_KEY='${{ secrets.TMDB_KEY }}';" > config.js
          echo "export const RAWG_KEY='${{ secrets.RAWG_KEY }}';" >> config.js
          echo "export const GOOGLE_BOOKS_KEY='${{ secrets.GOOGLE_BOOKS_KEY }}';" >> config.js
          echo "export const STEAMGRID_KEY='${{ secrets.STEAMGRID_KEY }}';" >> config.js

      - name: Prepare site folder
        run: |
          mkdir site
          find . -maxdepth 1 ! -name "site" ! -name ".github" -exec cp -r {} site/ \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
