<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mon Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12181C;
    --surface:#1B2329;
    --surface-2:#222C33;
    --border:#2E3941;
    --text:#E9E6DD;
    --text-dim:#8FA0A6;
    --accent:#E1A63C;
    --accent-dim:#8A6A2C;
    --accent-2:#4FA98C;
    --danger:#C1554A;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  header.top{
    padding:22px 18px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  header.top h1{
    margin:0;
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.04em;
  }
  main{padding:16px;}
  .view{display:none;}
  .view.active{display:block;}

  /* Search */
  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  input[type=text], input[type=date]{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius);
    padding:11px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    width:100%;
  }
  input[type=text]:focus, input[type=date]:focus{outline:1px solid var(--accent);}
  button{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:11px 14px;
    cursor:pointer;
  }
  button:active{transform:translateY(1px);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#1B1400;font-weight:600;}
  button.danger-outline{border-color:var(--danger);color:var(--danger);background:transparent;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .chip{
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:99px;
    font-size:12px;
    color:var(--text-dim);
    cursor:pointer;
    background:var(--surface);
    user-select:none;
  }
  .chip.active{border-color:var(--accent);color:var(--accent);background:rgba(225,166,60,.08);}

  .status-line{font-size:12px;color:var(--text-dim);margin:6px 0 14px;min-height:16px;}
  .status-line.error{color:var(--danger);}

  .result-list, .season-list{display:flex;flex-direction:column;gap:8px;}
  .result-card{
    display:flex;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:8px;
    cursor:pointer;
    align-items:center;
  }
  .result-card.selected{border-color:var(--accent);background:rgba(225,166,60,.06);}
  .poster{
    width:52px;height:78px;
    object-fit:cover;
    border-radius:4px;
    background:var(--surface-2);
    flex-shrink:0;
    border:1px solid var(--border);
  }
  .poster.wide{width:78px;height:52px;}
  .result-info{min-width:0;}
  .result-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .result-meta{font-size:11px;color:var(--text-dim);margin-top:3px;}

  .panel{
    background:transparent;
    padding:0;
  }
  .panel-head{display:flex;gap:12px;margin-bottom:14px;}
  .panel-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;}
  .panel-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);letter-spacing:.03em;margin-bottom:6px;}
  .note-row{display:flex;align-items:center;gap:14px;}
  .note-value{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--accent);width:44px;text-align:center;}
  input[type=range]{-webkit-appearance:none;flex:1;height:4px;background:var(--border);border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;}
  .panel-actions{display:flex;gap:8px;margin-top:4px;}
  .panel-actions button{flex:1;}

  .subtitle-select{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;}
  .subtitle-chip{
    flex-shrink:0;width:66px;text-align:center;cursor:pointer;
    border:1px solid var(--border);border-radius:var(--radius);padding:6px;background:var(--surface-2);
  }
  .subtitle-chip.selected{border-color:var(--accent);}
  .subtitle-chip img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;background:var(--surface);}
  .subtitle-chip .lbl{font-size:9px;color:var(--text-dim);margin-top:4px;line-height:1.2;}

  .note-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .note-btn{
    padding:12px 0;text-align:center;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface-2);font-family:'Fraunces',serif;font-size:16px;font-weight:600;
    cursor:pointer;color:var(--text);
  }
  .note-btn.selected{border-color:var(--accent);background:var(--accent);color:#1B1400;}

  select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:11px 12px;font-family:'IBM Plex Mono',monospace;
    font-size:14px;width:100%;
  }
  textarea{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:10px 12px;font-family:'IBM Plex Mono',monospace;
    font-size:13px;width:100%;min-height:64px;resize:vertical;
  }
  textarea:focus{outline:1px solid var(--accent);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,10,12,.62);
    display:none;align-items:flex-end;justify-content:center;z-index:200;
  }
  .modal-overlay.active{display:flex;}
  .modal-panel{
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    background:var(--surface);border:1px solid var(--accent-dim);
    border-radius:16px 16px 0 0;padding:18px;position:relative;
    animation:slideUp .18s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(18px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
  .modal-close{
    position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;
    padding:0;font-size:13px;line-height:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
  }

  /* History */
  .hist-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;}
  .hist-count{font-size:12px;color:var(--text-dim);}
  .hist-actions{display:flex;gap:6px;}
  .hist-actions button{padding:8px 10px;font-size:12px;}
  .hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;}
  .hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;}
  .hist-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--surface-2);}
  .hist-badge{
    position:absolute;top:6px;left:6px;background:rgba(18,24,28,.85);
    color:var(--accent);font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;
    font-family:'Fraunces',serif;
  }
  .hist-type{
    position:absolute;top:6px;right:6px;background:rgba(18,24,28,.85);
    color:var(--text-dim);font-size:8px;letter-spacing:.03em;padding:2px 5px;border-radius:4px;
  }
  .hist-body{padding:8px;}
  .hist-title{font-family:'Fraunces',serif;font-size:12.5px;font-weight:600;line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:29px;}
  .hist-date{font-size:9.5px;color:var(--text-dim);margin-top:4px;}
  .hist-comment{
    font-size:9.5px;color:var(--text-dim);margin-top:4px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    font-style:italic;
  }
  .hist-del{
    margin-top:6px;width:100%;font-size:10px;padding:5px;background:transparent;border-color:var(--border);color:var(--text-dim);
  }
  .empty-state{color:var(--text-dim);font-size:13px;text-align:center;padding:40px 10px;line-height:1.6;}

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;background:var(--surface);border-top:1px solid var(--border);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;background:none;border:none;color:var(--text-dim);
    font-family:'Fraunces',serif;font-size:14px;padding:8px;border-radius:6px;
  }
  nav.tabbar button.active{color:var(--accent);background:rgba(225,166,60,.08);}

  input[type=file]{display:none;}
  .toast{
    position:fixed;bottom:86px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--accent-dim);color:var(--text);
    padding:10px 16px;border-radius:var(--radius);font-size:12px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top">
  <h1>Mon Catalogue</h1>
  <div class="sub">notes & historique perso</div>
</header>

<main>

  <!-- SEARCH VIEW -->
  <section id="view-search" class="view active">
    <div class="chips" id="type-chips">
      <div class="chip active" data-type="Film">Film</div>
      <div class="chip" data-type="Documentaire">Documentaire</div>
      <div class="chip" data-type="Série">Série</div>
      <div class="chip" data-type="Manga">Manga</div>
      <div class="chip" data-type="BD">BD</div>
      <div class="chip" data-type="Roman">Roman</div>
      <div class="chip" data-type="Jeu">Jeu</div>
    </div>

    <div class="search-row">
      <input type="text" id="search-input" placeholder="Chercher un titre…">
      <button class="primary" id="search-btn">Go</button>
    </div>

    <div class="status-line" id="search-status"></div>
    <div class="result-list" id="results"></div>
  </section>

  <!-- HISTORY VIEW -->
  <section id="view-history" class="view">
    <div class="hist-toolbar">
      <div class="hist-count" id="hist-count">0 œuvre(s) notée(s)</div>
      <div class="hist-actions">
        <button id="export-btn">Exporter</button>
        <button id="import-btn">Importer</button>
        <input type="file" id="import-file" accept="application/json">
      </div>
    </div>
    <div class="hist-grid" id="hist-grid"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-panel">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="panel-container"></div>
  </div>
</div>

<nav class="tabbar">
  <button class="active" data-view="search">Recherche</button>
  <button data-view="history">Historique</button>
</nav>

<script>
/* ============ CONFIG ============ */
const TMDB_KEY = "a5a1ca957e940e4898e3c4b4b9f6cea1";
const RAWG_KEY = "270141bef953462ea5386f08a3d9e27d";
const GOOGLE_BOOKS_KEY = "AIzaSyCrDTnaCVkdvWsbi2-QGMdKIxQNw8NopcI";
const STEAMGRID_KEY = "123698009560a02b008c9cf98c607671";
const TMDB_IMG = "https://image.tmdb.org/t/p/w200";
const DEFAULT_PLATFORMS = ["PC","PlayStation","Xbox","Nintendo Switch","Android","iOS","Autre"];
const NO_POSTER = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300' viewBox='0 0 200 300'><rect width='200' height='300' fill='#222C33'/><text x='100' y='155' font-family='monospace' font-size='13' fill='#8FA0A6' text-anchor='middle'>pas d'affiche</text></svg>`
);

/* ============ INDEXEDDB ============ */
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open("catalogue-db", 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains("entries")){
        d.createObjectStore("entries", {keyPath:"id"});
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}
function dbAll(){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("entries","readonly");
    const store = tx.objectStore("entries");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result.sort((a,b)=> b.dateAjout.localeCompare(a.dateAjout)));
    req.onerror = e => reject(e);
  });
}
function dbPut(entry){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("entries","readwrite");
    tx.objectStore("entries").put(entry);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}
function dbDelete(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("entries","readwrite");
    tx.objectStore("entries").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

/* ============ STATE ============ */
let currentType = "Film";
let currentResults = [];
let selectedItem = null;     // the raw picked search result
let selectedSubtitle = null; // e.g. chosen season object, for series

/* ============ UI: TABS ============ */
document.querySelectorAll("nav.tabbar button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabbar button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById("view-"+btn.dataset.view).classList.add("active");
    if(btn.dataset.view === "history") renderHistory();
  });
});

document.querySelectorAll("#type-chips .chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    document.querySelectorAll("#type-chips .chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    currentType = chip.dataset.type;
    clearResults();
  });
});

function clearResults(){
  currentResults = [];
  selectedItem = null;
  selectedSubtitle = null;
  document.getElementById("results").innerHTML = "";
  closeModal();
  setStatus("");
}
function openModal(){
  document.getElementById("modal-overlay").classList.add("active");
}
function closeModal(){
  document.getElementById("modal-overlay").classList.remove("active");
  document.getElementById("panel-container").innerHTML = "";
}
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-overlay").addEventListener("click", (e)=>{
  if(e.target.id === "modal-overlay") closeModal();
});
function setStatus(msg, isError){
  const el = document.getElementById("search-status");
  el.textContent = msg || "";
  el.className = "status-line" + (isError ? " error" : "");
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ============ SEARCH ============ */
document.getElementById("search-btn").addEventListener("click", runSearch);
document.getElementById("search-input").addEventListener("keydown", e=>{
  if(e.key === "Enter") runSearch();
});

async function runSearch(){
  const q = document.getElementById("search-input").value.trim();
  if(!q){ setStatus("Tape un titre à chercher.", true); return; }
  closeModal();
  selectedItem = null; selectedSubtitle = null;
  setStatus("Recherche…");
  document.getElementById("results").innerHTML = "";
  try{
    let results = [];
    if(currentType === "Film"){
      results = (await searchTMDB(q, "movie")).filter(r => !(r.raw.genre_ids||[]).includes(99));
    } else if(currentType === "Documentaire"){
      results = (await searchTMDB(q, "movie")).filter(r => (r.raw.genre_ids||[]).includes(99));
    } else if(currentType === "Série"){
      results = await searchTMDB(q, "tv");
    } else if(currentType === "Manga" || currentType === "BD" || currentType === "Roman"){
      results = await searchBooksMerged(q, currentType);
    } else if(currentType === "Jeu"){
      results = await searchRAWG(q);
    }
    currentResults = results;
    if(results.length === 0){
      setStatus("Aucun résultat.");
    } else {
      setStatus(results.length + " résultat(s)");
    }
    renderResults();
  }catch(err){
    console.error(err);
    setStatus("Erreur pendant la recherche (connexion ou clé API). " + err.message, true);
  }
}

async function searchTMDB(q, kind){
  const url = `https://api.themoviedb.org/3/search/${kind}?api_key=${TMDB_KEY}&language=fr-FR&query=${encodeURIComponent(q)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("TMDB " + res.status);
  const data = await res.json();
  return (data.results||[]).slice(0,20).map(r=>({
    source:"tmdb_"+kind,
    id:r.id,
    title: kind==="movie" ? r.title : r.name,
    year: (kind==="movie" ? r.release_date : r.first_air_date || "").slice(0,4),
    poster: r.poster_path ? TMDB_IMG + r.poster_path : null,
    raw:r
  }));
}

async function searchGoogleBooks(q, type){
  let query = q;
  if(type === "BD") query += " bande dessinée";
  if(type === "Manga") query += " manga";
  const url = `https://www.googleapis.com/books/v1/volumes?maxResults=24&q=${encodeURIComponent(query)}&key=${GOOGLE_BOOKS_KEY}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Google Books " + res.status);
  const data = await res.json();
  return (data.items||[]).map(it=>{
    const v = it.volumeInfo || {};
    return {
      source:"book",
      id: it.id,
      title: v.title + (v.subtitle ? " — " + v.subtitle : ""),
      year: (v.publishedDate||"").slice(0,4),
      author: (v.authors||[]).join(", "),
      poster: v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail) : null,
      categories: v.categories || [],
      raw: v
    };
  });
}

async function searchOpenLibrary(q, type){
  const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=24&fields=title,author_name,first_publish_year,cover_i,key,subject`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Open Library " + res.status);
  const data = await res.json();
  return (data.docs||[]).map(d=>({
    source:"openlib",
    id: d.key,
    title: d.title,
    year: d.first_publish_year ? String(d.first_publish_year) : "",
    author: (d.author_name||[]).join(", "),
    poster: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : null,
    categories: (d.subject||[]).slice(0,6),
    raw: d
  }));
}

function normTitle(t){
  return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}

function relevantForType(item, type){
  const text = ((item.categories||[]).join(" ") + " " + (item.title||"")).toLowerCase();
  const hasComicSignal = text.includes("comic") || text.includes("graphic novel") || text.includes("bande dessin") || text.includes(" bd ");
  const hasMangaSignal = text.includes("manga");
  if(type === "BD"){
    if(hasMangaSignal && !hasComicSignal) return false;
    if(hasComicSignal) return true;
    if(item.categories && item.categories.length) return false; // catégorisé mais pas BD -> exclu
    return true; // pas d'info -> on garde par défaut
  }
  if(type === "Manga"){
    if(hasMangaSignal) return true;
    if(hasComicSignal) return true;
    if(item.categories && item.categories.length) return false;
    return true;
  }
  if(type === "Roman"){
    if(hasComicSignal || hasMangaSignal) return false;
    return true;
  }
  return true;
}

async function searchBooksMerged(q, type){
  const [gRes, oRes] = await Promise.allSettled([searchGoogleBooks(q, type), searchOpenLibrary(q, type)]);
  const combined = [];
  if(gRes.status === "fulfilled") combined.push(...gRes.value);
  if(oRes.status === "fulfilled") combined.push(...oRes.value);
  if(combined.length === 0 && gRes.status === "rejected" && oRes.status === "rejected"){
    throw new Error("Google Books & Open Library indisponibles");
  }
  const seen = new Set();
  const deduped = [];
  combined.forEach(item=>{
    const key = normTitle(item.title) + "|" + normTitle(item.author);
    if(!seen.has(key)){
      seen.add(key);
      deduped.push(item);
    }
  });
  return deduped.filter(item => relevantForType(item, type)).slice(0, 24);
}

async function searchRAWG(q){
  const url = `https://api.rawg.io/api/games?key=${RAWG_KEY}&search=${encodeURIComponent(q)}&page_size=20`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("RAWG " + res.status);
  const data = await res.json();
  return (data.results||[]).map(g=>{
    const platforms = (g.platforms||[]).map(p=> p.platform && p.platform.name).filter(Boolean);
    return {
      source:"game",
      id:g.id,
      title:g.name,
      year:(g.released||"").slice(0,4),
      poster:null, // remplie ensuite via SteamGridDB (jaquette, pas de screenshot)
      platforms: platforms.length ? platforms : DEFAULT_PLATFORMS,
      raw:g
    };
  });
}

async function fetchSteamGridCover(name){
  try{
    const searchRes = await fetch(`https://www.steamgriddb.com/api/v2/search/autocomplete/${encodeURIComponent(name)}`, {
      headers:{ "Authorization": `Bearer ${STEAMGRID_KEY}` }
    });
    if(!searchRes.ok) return null;
    const searchData = await searchRes.json();
    const game = (searchData.data||[])[0];
    if(!game) return null;
    const gridRes = await fetch(`https://www.steamgriddb.com/api/v2/grids/game/${game.id}?dimensions=600x900`, {
      headers:{ "Authorization": `Bearer ${STEAMGRID_KEY}` }
    });
    if(!gridRes.ok) return null;
    const gridData = await gridRes.json();
    const grids = gridData.data || [];
    if(!grids.length) return null;
    const clean = grids.filter(g => !g.nsfw && !g.humor);
    const best = clean.find(g => g.style === "alternate") || clean[0] || grids[0];
    return best ? best.url : null;
  }catch(e){
    return null;
  }
}

function renderResults(){
  const wrap = document.getElementById("results");
  wrap.innerHTML = "";
  currentResults.forEach((item, idx)=>{
    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <img class="poster" src="${item.poster || NO_POSTER}" onerror="this.src='${NO_POSTER}'" id="poster-${idx}">
      <div class="result-info">
        <div class="result-title">${escapeHtml(item.title)}</div>
        <div class="result-meta">${item.year || ""}${item.author ? " · " + escapeHtml(item.author) : ""}</div>
      </div>`;
    card.addEventListener("click", ()=> selectResult(idx));
    wrap.appendChild(card);

    if(item.source === "game"){
      fetchSteamGridCover(item.title).then(url=>{
        const finalUrl = url || item.raw.background_image || null;
        if(finalUrl){
          item.poster = finalUrl;
          const img = document.getElementById("poster-"+idx);
          if(img) img.src = finalUrl;
        }
      });
    }
  });
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

/* ============ SELECT + PANEL ============ */
let seasonsList = null; // populated when a série is selected

let selectedNote = 7;

async function selectResult(idx){
  document.querySelectorAll(".result-card").forEach((c,i)=>c.classList.toggle("selected", i===idx));
  selectedItem = currentResults[idx];
  selectedSubtitle = null;
  seasonsList = null;
  selectedNote = 7;
  openModal();

  if(selectedItem.source === "tmdb_tv"){
    const container = document.getElementById("panel-container");
    container.innerHTML = `<div class="panel"><div class="status-line">Chargement des saisons…</div></div>`;
    try{
      const url = `https://api.themoviedb.org/3/tv/${selectedItem.id}?api_key=${TMDB_KEY}&language=fr-FR`;
      const res = await fetch(url);
      if(!res.ok) throw new Error("TMDB " + res.status);
      const data = await res.json();
      seasonsList = (data.seasons||[]).filter(s=>s.season_number >= 0);
    }catch(err){
      container.innerHTML = `<div class="panel"><div class="status-line error">Erreur chargement saisons: ${err.message}</div></div>`;
      return;
    }
  }
  renderPanel();
}

function renderPanel(){
  const container = document.getElementById("panel-container");
  const isSeries = selectedItem.source === "tmdb_tv";
  const isGame = selectedItem.source === "game";
  const posterUrl = selectedSubtitle
    ? (selectedSubtitle.poster_path ? TMDB_IMG+selectedSubtitle.poster_path : selectedItem.poster)
    : selectedItem.poster;
  const subtitleLabel = selectedSubtitle ? selectedSubtitle.name : null;

  let html = `<div class="panel">
    <div class="panel-head">
      <img class="poster" src="${posterUrl || NO_POSTER}" onerror="this.src='${NO_POSTER}'">
      <div>
        <div class="panel-title">${escapeHtml(selectedItem.title)}</div>
        <div class="panel-sub">${subtitleLabel ? escapeHtml(subtitleLabel)+" · " : ""}${selectedItem.year||""}${selectedItem.author? " · "+escapeHtml(selectedItem.author):""}</div>
      </div>
    </div>`;

  if(isSeries){
    html += `<div class="field">
      <label>Saisons disponibles</label>
      <div class="subtitle-select" id="season-select"></div>
    </div>`;
  }

  if(!isSeries || selectedSubtitle){
    if(isGame){
      html += `<div class="field">
        <label>Plateforme</label>
        <select id="platform-select">
          ${selectedItem.platforms.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("")}
        </select>
      </div>`;
    }
    html += `
      <div class="field">
        <label>Note (1–10)</label>
        <div class="note-grid" id="note-grid"></div>
      </div>
      <div class="field">
        <label>Date de fin (visionnage / lecture)</label>
        <input type="date" id="date-fin" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <div class="field">
        <label>Mes notes (optionnel)</label>
        <textarea id="comment-field" placeholder="Ce que tu en penses, un souvenir, une remarque…"></textarea>
      </div>
      <div class="panel-actions">
        <button class="primary" id="save-entry-btn">Enregistrer</button>
      </div>`;
  } else {
    html += `<div class="status-line">Choisis une saison ci-dessus pour la noter.</div>`;
  }

  html += `</div>`;
  container.innerHTML = html;

  if(isSeries){
    const sel = document.getElementById("season-select");
    seasonsList.forEach(s=>{
      const chip = document.createElement("div");
      chip.className = "subtitle-chip" + (selectedSubtitle && selectedSubtitle.season_number === s.season_number ? " selected" : "");
      chip.innerHTML = `<img src="${s.poster_path ? TMDB_IMG+s.poster_path : (selectedItem.poster||NO_POSTER)}" onerror="this.src='${NO_POSTER}'">
        <div class="lbl">${escapeHtml(s.name)}</div>`;
      chip.addEventListener("click", ()=>{
        selectedSubtitle = s;
        renderPanel();
      });
      sel.appendChild(chip);
    });
  }

  const noteGrid = document.getElementById("note-grid");
  if(noteGrid){
    for(let n=1;n<=10;n++){
      const btn = document.createElement("div");
      btn.className = "note-btn" + (n===selectedNote ? " selected" : "");
      btn.textContent = n;
      btn.addEventListener("click", ()=>{
        selectedNote = n;
        noteGrid.querySelectorAll(".note-btn").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
      });
      noteGrid.appendChild(btn);
    }
  }

  const saveBtn = document.getElementById("save-entry-btn");
  if(saveBtn) saveBtn.addEventListener("click", saveCurrentEntry);
}

async function saveCurrentEntry(){
  const dateFin = document.getElementById("date-fin").value;
  const commentaire = document.getElementById("comment-field").value.trim();
  const posterUrl = selectedSubtitle
    ? (selectedSubtitle.poster_path ? TMDB_IMG+selectedSubtitle.poster_path : selectedItem.poster)
    : selectedItem.poster;
  const platformEl = document.getElementById("platform-select");
  const platformValue = platformEl ? platformEl.value : null;

  let subtitle = "";
  if(selectedSubtitle) subtitle = selectedSubtitle.name;
  else if(platformValue) subtitle = platformValue;
  else if(selectedItem.author) subtitle = selectedItem.author;

  const idParts = [selectedItem.source, selectedItem.id, selectedSubtitle ? selectedSubtitle.season_number : (platformValue || "")];
  const entry = {
    id: idParts.join("_"),
    type: currentType,
    title: selectedItem.title,
    subtitle: subtitle,
    note: selectedNote,
    dateFin: dateFin || "",
    commentaire: commentaire || "",
    posterUrl: posterUrl || "",
    dateAjout: new Date().toISOString()
  };
  try{
    await dbPut(entry);
    showToast("Enregistré ✓ " + entry.title + (entry.subtitle ? " — "+entry.subtitle : ""));
    closeModal();
    document.querySelectorAll(".result-card").forEach(c=>c.classList.remove("selected"));
  }catch(err){
    showToast("Erreur d'enregistrement: " + err.message);
  }
}

/* ============ HISTORY ============ */
async function renderHistory(){
  const grid = document.getElementById("hist-grid");
  const entries = await dbAll();
  document.getElementById("hist-count").textContent = entries.length + " œuvre(s) notée(s)";
  if(entries.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Rien noté pour l'instant.<br>Va dans l'onglet Recherche pour ajouter ta première œuvre.</div>`;
    return;
  }
  grid.innerHTML = "";
  entries.forEach(e=>{
    const card = document.createElement("div");
    card.className = "hist-card";
    const dateLabel = e.dateFin ? formatDate(e.dateFin) : "";
    card.innerHTML = `
      <img src="${e.posterUrl || NO_POSTER}" onerror="this.src='${NO_POSTER}'">
      <div class="hist-badge">${e.note}/10</div>
      <div class="hist-type">${e.type}</div>
      <div class="hist-body">
        <div class="hist-title">${escapeHtml(e.title)}${e.subtitle ? " — "+escapeHtml(e.subtitle) : ""}</div>
        <div class="hist-date">${dateLabel}</div>
        ${e.commentaire ? `<div class="hist-comment">${escapeHtml(e.commentaire)}</div>` : ""}
        <button class="hist-del" data-id="${e.id}">Supprimer</button>
      </div>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll(".hist-del").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(confirm("Supprimer cette entrée ?")){
        await dbDelete(btn.dataset.id);
        renderHistory();
      }
    });
  });
}
function formatDate(iso){
  const parts = iso.split("-");
  if(parts.length!==3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

/* ============ EXPORT / IMPORT ============ */
document.getElementById("export-btn").addEventListener("click", async ()=>{
  const entries = await dbAll();
  const blob = new Blob([JSON.stringify(entries, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `catalogue-sauvegarde-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("Export lancé");
});

document.getElementById("import-btn").addEventListener("click", ()=>{
  document.getElementById("import-file").click();
});
document.getElementById("import-file").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data)) throw new Error("Format inattendu");
    for(const entry of data){
      if(entry.id) await dbPut(entry);
    }
    showToast(`${data.length} entrée(s) importée(s)`);
    renderHistory();
  }catch(err){
    showToast("Erreur d'import: " + err.message);
  }
  e.target.value = "";
});

/* ============ INIT ============ */
openDB().then(()=>{
  renderHistory();
}).catch(err=>{
  console.error(err);
  showToast("Erreur d'ouverture de la base locale.");
});
</script>
