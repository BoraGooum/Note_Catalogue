<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médiathèque Perso</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --success-hover: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    header {
      background-color: var(--surface);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { font-size: 1.25rem; color: var(--primary); }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-add, .btn-export {
      background-color: var(--primary);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .btn-export {
      background-color: var(--success);
      color: #fff;
    }

    .btn-export:active { background-color: var(--success-hover); }

    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab {
      background: var(--surface-light);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      color: var(--text);
    }

    .tab.active {
      background: var(--primary);
      color: #000;
      font-weight: bold;
    }

    .container { padding: 1rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid var(--surface-light);
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background-color: #000;
    }

    .card-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .card-type {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .rating { color: #f59e0b; font-size: 0.8rem; font-weight: bold; }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      padding: 1rem;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--surface);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      padding: 1rem;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box { display: flex; gap: 8px; }

    .search-box input, select {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--surface-light);
      background: var(--bg);
      color: var(--text);
    }

    .results-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 50vh;
    }

    .result-item {
      display: flex;
      gap: 10px;
      background: var(--bg);
      padding: 8px;
      border-radius: 6px;
      align-items: center;
      cursor: pointer;
    }

    .result-item img {
      width: 40px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }

    .result-info { flex: 1; }
    .result-title { font-size: 0.85rem; font-weight: bold; }
    .result-sub { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Ma Médiathèque</h1>
      <div class="header-buttons">
        <button class="btn-export" onclick="exporterVersGoogleSheet()"><i class="fa-solid fa-file-excel"></i> Sheet</button>
        <button class="btn-add" onclick="ouvrirModal()"><i class="fa-solid fa-plus"></i> Ajouter</button>
      </div>
    </div>
    <div class="nav-tabs">
      <button class="tab active" onclick="filtrer('tous', this)">Tous</button>
      <button class="tab" onclick="filtrer('jeu', this)">Jeux</button>
      <button class="tab" onclick="filtrer('film', this)">Films</button>
      <button class="tab" onclick="filtrer('serie', this)">Séries</button>
      <button class="tab" onclick="filtrer('livre', this)">Livres</button>
    </div>
  </header>

  <div class="container">
    <div id="grid" class="grid"></div>
  </div>

  <!-- Modal Recherche -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Ajouter un média</h3>
        <button onclick="fermerModal()" style="background:none; border:none; color:var(--text); font-size:1.2rem; cursor:pointer;">&times;</button>
      </div>
      
      <div class="search-box">
        <select id="mediaType">
          <option value="film">Film (TMDB)</option>
          <option value="serie">Série (TMDB)</option>
          <option value="jeu">Jeu (RAWG)</option>
          <option value="livre">Livre (Google)</option>
        </select>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher un titre...">
        <button class="btn-add" onclick="rechercher()">Chercher</button>
      </div>

      <div id="results" class="results-list"></div>
    </div>
  </div>

  <script>
    // Configuration API & Webhook
    const TMDB_KEY = "4f2249c30f40d7c71f0dd3a55a8f4c2c";
    const RAWG_KEY = "79dbfbf62a5649b5a0342cb23fb2711d";
    const STEAMGRID_KEY = "123698009560a02b008c9cf98c607671";
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx1ntJcOrokJrdn9YF1amTiDCeWo_FASmJ8My3h1ZmZ2Z9mjnxwjnjHYKvSyjWyoF8J/exec";

    let catalogue = JSON.parse(localStorage.getItem('mediaCatalog')) || [];
    let filtreActif = 'tous';

    function enregistrer() {
      localStorage.setItem('mediaCatalog', JSON.stringify(catalogue));
      afficher();
    }

    function afficher() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const items = catalogue.filter(i => filtreActif === 'tous' || i.type === filtreActif);

      if (items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Aucun élément dans cette catégorie.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/150x200?text=No+Cover'}" alt="${item.titre}">
          <div class="card-body">
            <div>
              <div class="card-title">${item.titre}</div>
              <div class="card-type">${item.type}</div>
            </div>
            <div class="card-actions">
              <span class="rating"><i class="fa-solid fa-star"></i> ${item.note || 'N/A'}</span>
              <button class="btn-delete" onclick="supprimer(${item.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrer(type, elem) {
      filtreActif = type;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      elem.classList.add('active');
      afficher();
    }

    function supprimer(id) {
      catalogue = catalogue.filter(i => i.id !== id);
      enregistrer();
    }

    function ouvrirModal() { document.getElementById('modal').classList.add('active'); }
    function fermerModal() { 
      document.getElementById('modal').classList.remove('active'); 
      document.getElementById('results').innerHTML = '';
      document.getElementById('searchInput').value = '';
    }

    async function rechercher() {
      const query = document.getElementById('searchInput').value.trim();
      const type = document.getElementById('mediaType').value;
      const resultsDiv = document.getElementById('results');

      if (!query) return;
      resultsDiv.innerHTML = '<p style="text-align:center; padding:1rem;">Recherche en cours...</p>';

      let results = [];

      try {
        if (type === 'film') {
          const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=fr-FR`);
          const data = await res.json();
          results = (data.results || []).map(r => ({
            id: Date.now() + Math.random(),
            titre: r.title,
            type: 'film',
            image: r.poster_path ? `https://image.tmdb.org/t/p/w500${r.poster_path}` : '',
            note: r.vote_average ? r.vote_average.toFixed(1) : 'N/A'
          }));
        } else if (type === 'serie') {
          const res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=fr-FR`);
          const data = await res.json();
          results = (data.results || []).map(r => ({
            id: Date.now() + Math.random(),
            titre: r.name,
            type: 'serie',
            image: r.poster_path ? `https://image.tmdb.org/t/p/w500${r.poster_path}` : '',
            note: r.vote_average ? r.vote_average.toFixed(1) : 'N/A'
          }));
        } else if (type === 'jeu') {
          const res = await fetch(`https://api.rawg.io/api/games?key=${RAWG_KEY}&search=${encodeURIComponent(query)}`);
          const data = await res.json();
          results = (data.results || []).map(r => ({
            id: Date.now() + Math.random(),
            titre: r.name,
            type: 'jeu',
            image: r.background_image || '',
            note: r.rating ? r.rating.toFixed(1) : 'N/A'
          }));
        } else if (type === 'livre') {
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}`);
          const data = await res.json();
          results = (data.items || []).map(r => ({
            id: Date.now() + Math.random(),
            titre: r.volumeInfo.title,
            type: 'livre',
            image: r.volumeInfo.imageLinks?.thumbnail ? r.volumeInfo.imageLinks.thumbnail.replace('http:', 'https:') : '',
            note: r.volumeInfo.averageRating || 'N/A'
          }));
        }

        afficherResultats(results);
      } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = '<p style="color:var(--danger); text-align:center;">Erreur lors de la recherche.</p>';
      }
    }

    function afficherResultats(list) {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (list.length === 0) {
        resultsDiv.innerHTML = '<p style="text-align:center;">Aucun résultat trouvé.</p>';
        return;
      }

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/40x60'}" alt="">
          <div class="result-info">
            <div class="result-title">${item.titre}</div>
            <div class="result-sub">${item.type.toUpperCase()} • Note: ${item.note}</div>
          </div>
        `;
        div.onclick = () => {
          catalogue.push(item);
          enregistrer();
          fermerModal();
        };
        resultsDiv.appendChild(div);
      });
    }

    // Exportation automatique vers Google Sheet
    async function exporterVersGoogleSheet() {
      if (catalogue.length === 0) {
        alert("Ton catalogue est totalement vide !");
        return;
      }

      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(catalogue)
        });

        alert("Catalogue exporté avec succès vers ton Google Sheet !");
      } catch (erreur) {
        console.error("Erreur lors de l'export :", erreur);
        alert("Une erreur s'est produite lors de l'exportation.");
      }
    }

    // Initialisation
    document.addEventListener("DOMContentLoaded", afficher);
  </script>
</body>
</html>
