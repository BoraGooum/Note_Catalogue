<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médiathèque Perso</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #161920;
      --accent-color: #e5a93c;
      --text-color: #e1e4ea;
      --text-muted: #8b949e;
      --border-color: #2a2e39;
      --font-title: 'Fraunces', serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-mono);
      padding-bottom: 80px;
    }

    /* Navigation / Header */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    h1 {
      font-family: var(--font-title);
      color: var(--accent-color);
      font-size: 1.5rem;
    }

    nav {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border-color: var(--accent-color);
    }

    /* Main Container */
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Controls (Recherche, Filtres) */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .search-group {
      flex: 1;
      display: flex;
      gap: 0.5rem;
      min-width: 280px;
    }

    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.6rem;
      border-radius: 6px;
      font-family: var(--font-mono);
    }

    button.btn-primary {
      background: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    button.btn-outline {
      background: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .poster-wrapper {
      width: 100%;
      aspect-ratio: 2/3;
      overflow: hidden;
      background: var(--bg-color);
      position: relative;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex-grow: 1;
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 1rem;
      line-height: 1.2;
    }

    .card-sub {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .card-badge {
      display: inline-block;
      background: var(--border-color);
      color: var(--accent-color);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-top: auto;
      align-self: flex-start;
      text-transform: capitalize;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Info Box Option */
    .info-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
      font-size: 0.85rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <h1>Médiathèque</h1>
      <nav>
        <button class="nav-btn active" onclick="switchTab('collection', event)">Ma Collection</button>
        <button class="nav-btn" onclick="switchTab('ajouter', event)">Ajouter</button>
        <button class="nav-btn" onclick="switchTab('options', event)">Options</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- ONGLET 1: COLLECTION -->
    <section id="tab-collection" class="tab-content active">
      <div class="controls">
        <input type="text" id="filter-search" placeholder="Rechercher dans ma collection..." oninput="renderCollection()">
      </div>
      <div id="collection-grid" class="grid"></div>
    </section>

    <!-- ONGLET 2: AJOUTER -->
    <section id="tab-ajouter" class="tab-content">
      <div class="controls">
        <div class="search-group">
          <select id="category-select" onchange="handleCategoryChange(this.value)">
            <option value="film">Film</option>
            <option value="documentaire">Documentaire</option>
            <option value="serie">Série</option>
            <option value="jeux">Jeux</option>
            <option value="bd">BD</option>
            <option value="manga">Manga</option>
            <option value="roman">Roman</option>
            <option value="autre">Autre</option>
          </select>
          <button class="btn-outline" onclick="openManualModal()">➕ Manuel</button>
          <input type="text" id="api-search-input" placeholder="Titre à chercher...">
          <button class="btn-primary" onclick="searchAPI()">Chercher</button>
        </div>
      </div>

      <div id="search-results-grid" class="grid"></div>
    </section>

    <!-- ONGLET 3: OPTIONS -->
    <section id="tab-options" class="tab-content">
      <h2>Options & À propos</h2>
      <div class="info-box" id="github-info">
        Chargement des informations de version...
      </div>
    </section>
  </main>

  <!-- MODALE POUR ENTRÉE MANUELLE -->
  <div id="manual-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeManualModal()">&times;</button>
      <h3 style="font-family: var(--font-title); margin-bottom: 1rem; color: var(--accent-color);">Ajout Manuel</h3>
      
      <form id="manual-form" onsubmit="saveManualEntry(event)">
        <div class="form-group">
          <label for="m-title">Titre *</label>
          <input type="text" id="m-title" required placeholder="ex: Smile">
        </div>
        <div class="form-group">
          <label for="m-sub">Info + (saison, tome, etc.)</label>
          <input type="text" id="m-sub" placeholder="ex: Tome 2, Saison 6">
        </div>
        <div class="form-group">
          <label for="m-poster">URL de l'affiche (600x900)</label>
          <input type="text" id="m-poster" placeholder="https://image.url/affiche.jpg">
        </div>
        <div class="form-group">
          <label for="m-rating">Note (1 à 10)</label>
          <input type="number" id="m-rating" min="1" max="10" step="0.5" placeholder="8">
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="m-favorite"> Coup de cœur ❤️
          </label>
        </div>
        <div class="form-group">
          <label for="m-desc">Note en plus / Description</label>
          <textarea id="m-desc" rows="3" placeholder="Avis personnel, détails..."></textarea>
        </div>
        <div class="form-group">
          <label for="m-date">Date d'ajout</label>
          <input type="date" id="m-date">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">Enregistrer dans ma collection</button>
      </form>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'BoraGooum';
    const GITHUB_REPO = 'bot-ed';

    let collection = JSON.parse(localStorage.getItem('media_collection') || '[]');

    document.addEventListener('DOMContentLoaded', () => {
      const savedCategory = localStorage.getItem('last_selected_category') || 'film';
      const catSelect = document.getElementById('category-select');
      
      if (catSelect) {
        catSelect.value = savedCategory;
      }

      const dateInput = document.getElementById('m-date');
      if (dateInput) {
        dateInput.valueAsDate = new Date();
      }

      renderCollection();
      fetchGitHubCommitInfo();
    });

    function switchTab(tabId, e) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      const targetTab = document.getElementById(`tab-${tabId}`);
      if (targetTab) targetTab.classList.add('active');

      if (e && e.target) {
        e.target.classList.add('active');
      }
    }

    function handleCategoryChange(val) {
      localStorage.setItem('last_selected_category', val);
    }

    function openManualModal() {
      const currentCat = document.getElementById('category-select').value || 'autre';
      const modalTitle = document.querySelector('#manual-modal h3');
      if (modalTitle) {
        modalTitle.textContent = `AJOUT MANUEL (${currentCat.toUpperCase()})`;
      }
      document.getElementById('manual-modal').classList.add('active');
    }

    function closeManualModal() {
      document.getElementById('manual-modal').classList.remove('active');
    }

    function saveManualEntry(e) {
      e.preventDefault();

      const currentCategory = document.getElementById('category-select').value || 'autre';

      const newEntry = {
        id: 'manual_' + Date.now(),
        title: document.getElementById('m-title').value,
        sub: document.getElementById('m-sub').value,
        poster: document.getElementById('m-poster').value || 'https://via.placeholder.com/600x900?text=Pas+d%27image',
        rating: document.getElementById('m-rating').value,
        favorite: document.getElementById('m-favorite').checked,
        description: document.getElementById('m-desc').value,
        date: document.getElementById('m-date').value,
        category: currentCategory
      };

      collection.push(newEntry);
      localStorage.setItem('media_collection', JSON.stringify(collection));

      document.getElementById('manual-form').reset();
      document.getElementById('m-date').valueAsDate = new Date();
      closeManualModal();

      switchTab('collection');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const collectionBtn = document.querySelector('.nav-btn[onclick*="collection"]');
      if (collectionBtn) collectionBtn.classList.add('active');

      renderCollection();
    }

    function renderCollection() {
      const grid = document.getElementById('collection-grid');
      const search = document.getElementById('filter-search').value.toLowerCase();

      const filtered = collection.filter(item => 
        item.title.toLowerCase().includes(search) || 
        (item.sub && item.sub.toLowerCase().includes(search))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1;">Aucun élément trouvé.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="poster-wrapper">
            <img src="${item.poster}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-info">
            <div class="card-title">${item.title} ${item.favorite ? '❤️' : ''}</div>
            ${item.sub ? `<div class="card-sub">${item.sub}</div>` : ''}
            ${item.rating ? `<div class="card-sub">Note: ${item.rating}/10</div>` : ''}
            <span class="card-badge">${item.category}</span>
          </div>
        </div>
      `).join('');
    }

    function searchAPI() {
      const query = document.getElementById('api-search-input').value;
      if (!query) return;

      const grid = document.getElementById('search-results-grid');
      grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1;">Recherche en cours pour "${query}"...</p>`;
    }

    async function fetchGitHubCommitInfo() {
      const infoBox = document.getElementById('github-info');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/commits?per_page=1`);
        if (!response.ok) throw new Error('Erreur API');
        const data = await response.json();
        
        if (data && data[0]) {
          const date = new Date(data[0].commit.committer.date);
          const dateFormatted = date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
          const timeFormatted = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

          infoBox.innerHTML = `Créé par <strong>Gooumbora</strong>, mis à jour le <strong>${dateFormatted} à ${timeFormatted}</strong>.`;
        }
      } catch (err) {
        infoBox.innerHTML = `Créé par <strong>Gooumbora</strong>. (Impossible de charger la date de mise à jour en direct)`;
      }
    }
  </script>
</body>
</html>
