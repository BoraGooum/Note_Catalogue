<style>
:root{--bg:#0D0A1F;--surface:#17112E;--border:#2A1F4A;--accent:#B24BF3;--text:#EFECE6;--dim:#8B83A8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;padding:14px;}
h1{font-size:22px;background:linear-gradient(135deg,var(--accent),#FF5DA2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.sub{color:var(--dim);font-size:11px;margin-bottom:12px;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:10;}
.tab{flex-shrink:0;padding:7px 13px;border-radius:18px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--dim);cursor:pointer;}
.tab.active{background:linear-gradient(135deg,var(--accent),#7F5AF0);color:#fff;border-color:transparent;}
h2{font-size:13px;color:var(--accent);margin:20px 0 10px;letter-spacing:1px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 13px;}
.cell{position:relative;text-align:center;}
.num{position:absolute;top:-9px;left:-7px;z-index:9;min-width:27px;height:27px;padding:0 5px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.5);}
.box{position:relative;aspect-ratio:2/3;}
.art{position:absolute;inset:0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:13px;color:rgba(255,255,255,.85);text-shadow:0 2px 6px rgba(0,0,0,.6);text-align:center;padding:14px;}
.box svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 7px 12px rgba(0,0,0,.55));}
.lbl{font-size:10px;color:var(--dim);margin-top:7px;}
.glow svg{animation:gl 2.6s ease-in-out infinite;}
@keyframes gl{0%,100%{filter:drop-shadow(0 7px 12px rgba(0,0,0,.55))}50%{filter:drop-shadow(0 0 13px var(--gc,#B24BF3))}}
.nue .art{box-shadow:0 15px 30px rgba(0,0,0,.7);border-radius:6px;}
.long .art{box-shadow:14px 18px 0 rgba(0,0,0,.45);border-radius:4px;}
.perso{background:var(--surface);border:1px dashed var(--accent);border-radius:10px;padding:12px;font-size:11px;color:var(--dim);line-height:1.6;}
</style>
</head>

var NAMES=['DUNE','SEVERANCE','CONTROL','BERSERK','CITY HUNTER','KAFKA','CONFÉRENCE'];
var TYPES={film:'🎬 Film',serie:'📺 Série',jeu:'🎮 Jeu',manga:'📖 Manga',bd:'📕 BD',roman:'📚 Roman',libre:'🏷️ Libre',perso:'📂 Perso'};
var tabs=document.getElementById('tabs'),wrap=document.getElementById('wrap');
var all=document.createElement('div');all.className='tab active';all.dataset.f='all';all.textContent='Tous';tabs.appendChild(all);
Object.keys(TYPES).forEach(function(k){var b=document.createElement('div');b.className='tab';b.dataset.f=k;b.textContent=TYPES[k];tabs.appendChild(b);});
function build(filter){
  wrap.innerHTML='';
  Object.keys(TYPES).forEach(function(t){
    if(filter!=='all'&&filter!==t)return;
    if(t==='perso'){
      var h0=document.createElement('h2');h0.textContent='📂 MES IMAGES PERSO (106+)';wrap.appendChild(h0);
      var p=document.createElement('div');p.className='perso';p.innerHTML='Tes images uploadées dans <b>catalogue.html → Options → Apparence</b> prendront les numéros 106, 107, 108…<br>Normalisées automatiquement à la bonne taille (PNG, JPG, SVG).';wrap.appendChild(p);
      return;
    }
    var list=S.filter(function(s){return s.t===t;});
    if(!list.length)return;
    var h=document.createElement('h2');h.textContent=TYPES[t]+' ('+list[0].id+'-'+list[list.length-1].id+')';wrap.appendChild(h);
    var g=document.createElement('div');g.className='grid';
    list.forEach(function(s){
      var c=document.createElement('div');c.className='cell';
      if(s.glow){c.classList.add('glow');c.style.setProperty('--gc',s.glow);}
      if(s.nue)c.classList.add('nue');
      if(s.long)c.classList.add('long');
      var inner='<div class="num">'+s.id+'</div><div class="box"><div class="art" style="background:'+ART[s.id%7]+'">'+NAMES[s.id%7]+'</div>';
      if(s.frame)inner+=svg(s);
      if(s.scotch)inner+='<svg viewBox="0 0 200 300">'+X.scotch+'</svg>';
      if(s.fold)inner+='<svg viewBox="0 0 200 300">'+X.fold+'</svg>';
      if(s.glow)inner+='<svg viewBox="0 0 200 300"><rect x="3" y="3" width="194" height="294" rx="10" fill="none" stroke="'+s.glow+'" stroke-width="3"/></svg>';
      inner+='</div><div class="lbl">'+s.n+'</div>';
      c.innerHTML=inner;g.appendChild(c);
    });
    wrap.appendChild(g);
  });
}
tabs.addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(!t)return;
  tabs.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  t.classList.add('active');build(t.dataset.f);
});
