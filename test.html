<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Apercu - Episodes autour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#121216;--s2:#1A1A20;--bd:#4A3B7A;--acc:#B24BF3;--acc2:#7F5AF0;--tx:#F2EFF8;--dim:#9C93B8;--enc:#2CB67D;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.55;padding-bottom:40px;}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;}
.ic svg{width:18px;height:18px;display:block;}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px 14px;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);}
header .ic svg{width:28px;height:28px;color:var(--acc);}
header h1{font-family:'Fraunces',serif;font-size:26px;font-weight:700;}
main{padding:24px 16px;max-width:760px;margin:0 auto;}
.label{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:16px;}
.row{display:flex;gap:10px;margin-bottom:10px;}
.row label{flex:1;font-size:12px;font-weight:600;color:var(--dim);display:flex;flex-direction:column;gap:6px;}
input,textarea{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px;font-family:inherit;font-size:16px;width:100%;outline:none;}
input:focus,textarea:focus{border-color:var(--acc);}
button{font-family:inherit;font-size:15px;font-weight:600;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;font-weight:700;}
button.wide{width:100%;}
.feed{margin-top:8px;}
.jentry{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd);align-items:flex-start;}
.jentry .jp{width:50px;height:75px;border-radius:8px;flex-shrink:0;background:linear-gradient(160deg,#1F3A34,#0E1A17);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;}
.jentry .jc{flex:1;min-width:0;}
.jentry .jt{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace;margin-bottom:4px;}
.jentry .jx{font-size:14px;}
.jentry .jn{font-size:12px;font-weight:600;color:var(--acc);margin-top:4px;}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:24px 0;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:200;}
.overlay.on{display:flex;}
.sheet{width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;background:var(--s2);border:1px solid var(--bd);border-bottom:none;border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));}
.m-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--bd);}
.m-head h3{font-family:'Fraunces',serif;font-size:17px;color:var(--acc);flex:1;text-align:center;}
.back-btn{background:none;border:none;padding:8px;width:36px;height:36px;min-height:0;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.back-btn .ic svg{width:22px;height:22px;color:var(--tx);}
.m-body{overflow-y:auto;flex:1;padding-top:14px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{padding:8px 14px;min-height:38px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:var(--s1);color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;}
.sect{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;}
.eplist{max-height:180px;overflow-y:auto;border:1px solid var(--bd);border-radius:12px;background:var(--s1);}
.eprow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;}
.eprow:last-child{border-bottom:none;}
.eprow .box{width:22px;height:22px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.eprow.on .box{background:var(--acc);border-color:var(--acc);}
.eprow.on .box svg{display:block;}
.eprow .box svg{display:none;width:14px;height:14px;color:#fff;}
.eprow.cur{background:rgba(178,75,243,.12);color:var(--acc);font-weight:700;}
.eprow.cur .tagcur{margin-left:auto;font-size:10px;font-weight:700;color:var(--enc);}
.count{font-size:12px;color:var(--dim);text-align:center;margin:12px 0 4px;}
.m-foot{display:flex;gap:8px;padding-top:14px;border-top:1px solid var(--bd);}
.m-foot button{flex:1;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--acc);padding:10px 18px;border-radius:20px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:500;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<header>
<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg></span>
<h1>Ma Collection</h1>
</header>
<main>
<div class="label">Apercu - ajout d'episode (Lost S01E18)</div>

<div class="card">
<div class="row">
<label>S<input type="number" id="in-s" value="1" min="0"></label>
<label>E<input type="number" id="in-e" value="18" min="0"></label>
</div>
<textarea id="in-text" rows="2" placeholder="Ta note...">Vu, episode incroyable</textarea>
<button class="primary wide" id="btn-add"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>Ajouter</button>
</div>

<div class="label">Journal de septembre 2026</div>
<div class="feed" id="feed"><div class="empty">Aucune entree pour l'instant.</div></div>
</main>

<div class="overlay" id="ov">
<div class="sheet">
<div class="m-head">
<button class="back-btn" id="ep-back"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></span></button>
<h3 id="ep-title">Episodes autour de S01E18</h3>
<div style="width:36px;"></div>
</div>
<div class="m-body">
<div class="chips" id="presets">
<div class="chip" data-p="none">Aucun</div>
<div class="chip" data-p="before">Tout avant</div>
<div class="chip" data-p="after1">1 apres</div>
<div class="chip" data-p="after3">3 apres</div>
<div class="chip" data-p="afterall">Tout apres</div>
</div>
<div class="sect">Avant (deja vus ?)</div>
<div class="eplist" id="list-before"></div>
<div class="sect">En cours d'ajout</div>
<div class="eplist"><div class="eprow cur"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span><span id="cur-label">S01E18</span><span class="tagcur">AJOUTE</span></div></div>
<div class="sect">Apres (a ajouter aussi ?)</div>
<div class="eplist" id="list-after"></div>
<div class="count" id="count">0 episode supplementaire selectionne</div>
</div>
<div class="m-foot">
<button id="ep-cancel">Annuler</button>
<button class="primary" id="ep-ok"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span>Confirmer</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOTAL=24;
var sel={before:{},after:{}};
var cur={s:1,e:18,text:""};
function pad(n){return String(n).padStart(2,"0");}
function label(s,e){return "S"+pad(s)+"E"+pad(e);}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2000);}
function buildLists(){
var b=document.getElementById("list-before");b.innerHTML="";
for(var e=1;e<cur.e;e++){
(function(e){
var r=document.createElement("div");r.className="eprow"+(sel.before[e]?" on":"");
r.innerHTML='<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>'+label(cur.s,e)+"</span>";
r.addEventListener("click",function(){sel.before[e]=!sel.before[e];buildLists();});
b.appendChild(r);
})(e);
}
if(cur.e<=1){b.innerHTML='<div class="empty" style="padding:12px;">Rien avant.</div>';}
var a=document.getElementById("list-after");a.innerHTML="";
for(var e2=cur.e+1;e2<=TOTAL;e2++){
(function(e2){
var r=document.createElement("div");r.className="eprow"+(sel.after[e2]?" on":"");
r.innerHTML='<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>'+label(cur.s,e2)+"</span>";
r.addEventListener("click",function(){sel.after[e2]=!sel.after[e2];buildLists();});
a.appendChild(r);
})(e2);
}
if(cur.e>=TOTAL){a.innerHTML='<div class="empty" style="padding:12px;">Rien apres.</div>';}
var n=countSel();
document.getElementById("count").textContent=n+" episode"+(n>1?"s":"")+" supplementaire"+(n>1?"s":"")+" selectionne"+(n>1?"s":"");
}
function countSel(){var n=0;for(var k in sel.before){if(sel.before[k])n++;}for(var k2 in sel.after){if(sel.after[k2])n++;}return n;}
function clearChips(){document.querySelectorAll("#presets .chip").forEach(function(c){c.classList.remove("on");});}
document.querySelectorAll("#presets .chip").forEach(function(c){
c.addEventListener("click",function(){
clearChips();c.classList.add("on");
sel={before:{},after:{}};
var p=c.dataset.p;
if(p==="before"){for(var e=1;e<cur.e;e++)sel.before[e]=true;}
if(p==="after1"){sel.after[cur.e+1]=true;}
if(p==="after3"){for(var e2=cur.e+1;e2<=Math.min(TOTAL,cur.e+3);e2++)sel.after[e2]=true;}
if(p==="afterall"){for(var e3=cur.e+1;e3<=TOTAL;e3++)sel.after[e3]=true;}
buildLists();
});
});
document.getElementById("btn-add").addEventListener("click",function(){
cur.s=parseInt(document.getElementById("in-s").value||"1",10);
cur.e=parseInt(document.getElementById("in-e").value||"1",10);
cur.text=document.getElementById("in-text").value.trim();
sel={before:{},after:{}};
clearChips();
document.getElementById("ep-title").textContent="Episodes autour de "+label(cur.s,cur.e);
document.getElementById("cur-label").textContent=label(cur.s,cur.e);
buildLists();
document.getElementById("ov").classList.add("on");
});
function closeOv(){document.getElementById("ov").classList.remove("on");}
document.getElementById("ep-back").addEventListener("click",closeOv);
document.getElementById("ep-cancel").addEventListener("click",closeOv);
document.getElementById("ep-ok").addEventListener("click",function(){
var eps=[];
for(var e=1;e<cur.e;e++){if(sel.before[e])eps.push(e);}
eps.push(cur.e);
for(var e2=cur.e+1;e2<=TOTAL;e2++){if(sel.after[e2])eps.push(e2);}
eps.sort(function(a,b){return a-b;});
var feed=document.getElementById("feed");
feed.innerHTML="";
eps.forEach(function(ep){
var d=document.createElement("div");d.className="jentry";
d.innerHTML='<div class="jp">'+label(cur.s,ep)+'</div><div class="jc"><div class="jt">'+label(cur.s,ep)+"</div>"+'<div class="jx">'+(cur.text||"Vu")+"</div>"+'<div class="jn">Lost : Les Disparus</div></div>';
feed.appendChild(d);
});
closeOv();
toast(eps.length+" entree"+(eps.length>1?"s":"")+" ajoutee"+(eps.length>1?"s":""));
});
</script>
</body>
</html>
